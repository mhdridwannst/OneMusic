<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">OneMusic new release</title>
  <desc id="desc">Abstract purple and blue album artwork for new releases</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#120b2e"/>
      <stop offset="0.5" stop-color="#4c1d95"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="65%">
      <stop offset="0" stop-color="#c4b5fd" stop-opacity=".85"/>
      <stop offset="1" stop-color="#c4b5fd" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="800" fill="url(#background)"/>
  <circle cx="420" cy="270" r="340" fill="url(#glow)"/>
  <circle cx="400" cy="400" r="205" fill="none" stroke="#f5f3ff" stroke-opacity=".28" stroke-width="2"/>
  <circle cx="400" cy="400" r="150" fill="none" stroke="#f5f3ff" stroke-opacity=".2" stroke-width="2"/>
  <circle cx="400" cy="400" r="92" fill="#0f172a" fill-opacity=".72"/>
  <circle cx="400" cy="400" r="18" fill="#ddd6fe"/>
  <path d="M92 650C240 560 340 700 500 594C600 528 680 558 748 624" fill="none" stroke="#67e8f9" stroke-opacity=".4" stroke-width="6"/>
  <text x="64" y="730" fill="#f5f3ff" font-family="Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="8">ONEMUSIC</text>
</svg>
